# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Tính lại bằng src/lab13.py trên dữ liệu giả lập; công thức ở docs/du_lieu_va_cong_thuc.md.
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Theo yêu cầu: n=1.251 yêu cầu/nhóm.
#   b) Theo nhân viên, m=75: DE=1+(75-1)*0,02=2,48; ceil(1.251*2,48)=3.103
#      yêu cầu/nhóm; ceil(3.103/75)=42 nhân viên/nhóm, tổng 84 > 40.
#   c) 20 nhân viên/nhóm: n hiệu dụng luôn < 20/0,02=1.000 < 1.251.
#   d) 6 depot/nhóm: n hiệu dụng luôn < 6/0,02=300 < 1.251;
#      6 cụm/nhóm cũng thấp hơn mốc 20 cụm/nhóm.
#   e) Chênh 6 điểm: n=859/nhóm; 20m/[1+(m-1)*0,02] >= 859 khi m>=299;
#      m=299 cho DE=6,96; 5.980 yêu cầu thực/nhóm và 859,2 hiệu dụng/nhóm.
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Có: 20 nhân viên đối chứng làm cùng thời gian và cùng các depot với nhóm can thiệp.
#   2. Bốc thăm 20/20 bằng mã có seed lưu trước; cân bằng theo depot.
#   3. Có nguy cơ chia sẻ câu trả lời; giới hạn quyền trợ lý theo staff_id, kiểm tra log.
#   4. Chốt chỉ số chính, MDE 6 điểm, ngưỡng dừng, lịch và ngày quyết định trước pilot.
#   5. Có đúng 20 cụm nhân viên mỗi nhóm ở bước cuối; không dùng depot làm cụm.
#
# Đánh đổi: với 40 nhân viên không đủ power 0,80 cho chênh 5 điểm; chọn 6 điểm.
# Nếu tác động thật chỉ 5 điểm, power xấp xỉ 0,64.
#
# An toàn: 51/1.200=4,25% toàn mẫu; phạm vi noi_dia+hang_nang 39/982=3,97%
# (dữ liệu giả lập). Dùng chênh đối chứng +2 điểm và trần 6%, không dùng trần 3%.
# Lịch đề xuất: khởi động 2026-12-01; hai bước đầu mỗi bước 1 tuần, bước 50%
# trong 2 tuần; theo dõi mở lại đủ 7 ngày rồi quyết định 2027-01-05.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại 12 depot: lần lượt 2.696 đ và 8.221 đ/việc, thấp hơn mốc 12.000 đ [simulated]; quoc_te 22.515 đ/việc = 1,88 lần mốc [simulated], doi_tac cần xét điều khoản riêng"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
    method: "Bốc thăm 20 nhân viên can thiệp và 20 đối chứng, seed ghi trước; cân bằng theo depot"
    control: "Đối chứng dùng quy trình CSKH hiện tại cùng thời gian và depot"
  rollout: [0.10, 0.25, 0.50]
  rollout_schedule:
    - "2026-12-01 đến 2026-12-07: bật cho 4/40 nhân viên thuộc nhánh can thiệp; kiểm tra vận hành và an toàn"
    - "2026-12-08 đến 2026-12-14: bật cho 10/40 nhân viên thuộc nhánh can thiệp; kiểm tra vận hành và an toàn"
    - "2026-12-15 đến 2026-12-28: bật cho 20/40 nhân viên thuộc nhánh can thiệp; dùng riêng giai đoạn này để ước lượng chỉ số chính"
    - "2026-12-29 đến 2027-01-04: theo dõi đủ 7 ngày để phát hiện yêu cầu mở lại"
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    baseline_source: "Giả định thiết kế của đề bài; không phải tỉ lệ đo được từ mẫu chạy thử"
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    raw_n_per_arm: 5980
    requests_per_cluster: 299
    design_effect: 6.96
    clusters_per_arm: 20
    measurement: "Tỉ lệ đóng trong 24 giờ và không mở lại trong 7 ngày, so can thiệp với đối chứng"
  identifiability:
    concurrent_control: "20 nhân viên đối chứng làm cùng thời gian, cùng depot và cùng điều kiện chính sách"
    spillover_risk: "Cùng depot có thể chia sẻ gợi ý; chặn quyền trợ lý theo staff_id, log truy cập và rà ca đối chứng dùng trợ lý hằng tuần"
    predeclared: "Chốt phạm vi, seed, chỉ số chính, MDE 6 điểm, cỡ mẫu, luật dừng và ngày quyết định trước 2026-12-01"
  stop_rules:
    - "NẾU phát hiện ít nhất 1 khoản hoàn có từ 2 giao dịch đã ghi sổ khác nhau qua refund_ledger_write TRONG bất kỳ thời điểm nào, hoặc tỉ lệ mở lại 7 ngày của can thiệp cao hơn đối chứng ít nhất 2 điểm phần trăm hoặc vượt 6% TRONG 3 lần kiểm tra hằng ngày liên tiếp ở các đợt đã đủ thời gian theo dõi và có ít nhất 100 yêu cầu mỗi nhánh, THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển ca đang mở cho nhân viên KHÔNG THÌ chưa được tăng rollout khi chưa đủ kiểm tra an toàn"
    - "NẾU chi phí mỗi việc thành công trong phạm vi vượt 8.000 đ, tính theo tuần nhận yêu cầu đã đủ thời gian theo dõi từ token, tool, số phút xem lại và làm lại thực đo như trong chi_so.md, TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí dừng mở rộng hang_nang, rà chi phí và trình phương án giảm chi phí KHÔNG THÌ chưa tăng rollout khi thiếu dữ liệu đo của những tuần đã đến hạn đánh giá"
    - "NẾU tỉ lệ nhân viên sửa hoặc bỏ gợi ý trong số ca được xem lại vượt 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn ít nhất 5 nhân viên trong 3 ngày, rà 20 trace và đề xuất sửa KHÔNG THÌ chưa chuyển sang bước rollout tiếp theo"
  interim_looks: "Chỉ kiểm tra an toàn, hoàn trùng, chi phí và mức dùng theo luật dừng; không kết luận chỉ số chính trước khi đủ 20 cụm, 299 yêu cầu/người và 7 ngày theo dõi mở lại"
  rollback: "Giám đốc vận hành tắt quyền trợ lý trong 30 phút; nhân viên CSKH tự xử lý mọi yêu cầu đang mở và kế toán đối soát lệnh hoàn"
  decision_date: "2027-01-05"
  decision_rule: "Chỉ quyết định Go hoặc Go có điều kiện nếu đủ 20 cụm/nhóm, ít nhất 299 yêu cầu mỗi nhân viên ở giai đoạn 50%, đã chờ đủ 7 ngày mở lại và không kích hoạt luật dừng; nếu thiếu mẫu thì không kết luận tác động, Giám đốc vận hành quyết định kéo dài thu thập hoặc No-go"
  simulated_inputs:
    - "Chi phí quoc_te 22.515 đ/việc và tỉ số 1,88 từ A3 [simulated]"
    - "Chi phí noi_dia 2.696 đ, hang_nang 8.221 đ và toàn phạm vi 3.414 đ/việc từ A3-A4 [simulated]"
    - "Tỉ lệ mở lại 51/1.200=4,25% và 39/982=3,97% trong phạm vi từ CSV giả lập"
    - "Ngưỡng 8.000 đ được đặt từ mô hình chi phí có thành phần phút simulated; dùng số phút đo thật từ tuần 1 để đánh giá luật dừng"
